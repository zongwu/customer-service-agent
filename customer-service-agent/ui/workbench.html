<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潮汐客服台 · 坐席工作台</title>
<style>
/* ============================================================
   设计令牌 —— 取自 modao-export/02-zendesk-benchmark 色板
   主色 #1B7578（青绿）、#AD2634 红、#D9830F 橙、#0A6A46 绿
   版式：顶栏 86px；侧栏 / 队列 / 聊天 / AI 面板 四栏
   字号 12-16px（紧凑专业界面，非客服聊天页的大字号）
   ============================================================ */
:root {
  --brand:       #1B7578;
  --brand-dark:  #145E60;
  --brand-mid:   #C9E3E3;
  --brand-light: #E7F2F2;

  --bg:          #F1F3F4;
  --surface:     #FFFFFF;
  --surface-2:   #F7F8F9;
  --border:      #E0E3E6;
  --border-2:    #CCD1D6;

  --text:        #20262B;
  --text-mid:    #5C666E;
  --text-soft:   #8A9299;

  --red:         #AD2634;
  --red-bg:      #FBEEEF;
  --red-bd:      #F0D4D7;
  --orange:      #D9830F;
  --orange-bg:   #FBF3E7;
  --orange-bd:   #F2DFC2;
  --green:       #0A6A46;
  --green-bg:    #E8F3EE;

  --topbar-h:    56px;
  --nav-w:       248px;
  --queue-w:     316px;
  --ai-w:        336px;

  --shadow-sm:   0 1px 2px rgba(32,38,43,.05);
  --shadow-md:   0 2px 8px rgba(32,38,43,.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  min-width: 1180px;   /* 坐席工作台是桌面工具，窄屏横向滚动而非挤压 */
}

::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-soft); }
::-webkit-scrollbar-track { background: transparent; }

svg { display: block; }

/* ============ 顶栏 ============ */
.topbar {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.brand { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.brand-mark {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  background: var(--brand);
  border-radius: 8px;
}
.brand-mark svg { width: 17px; height: 17px; color: #fff; }
.brand-name { font-size: 14px; font-weight: 700; letter-spacing: .2px; }
.brand-sub  { font-size: 11px; color: var(--text-soft); letter-spacing: .4px; }

.search {
  flex: 1; max-width: 380px;
  display: flex; align-items: center; gap: 7px;
  padding: 6px 11px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-soft);
}
.search svg { width: 14px; height: 14px; flex-shrink: 0; }
.search input {
  flex: 1; min-width: 0;
  font: inherit; font-size: 13px;
  color: var(--text);
  background: none; border: none; outline: none;
}
.search input::placeholder { color: var(--text-soft); }
.search kbd {
  font: inherit; font-size: 11px;
  padding: 1px 5px;
  color: var(--text-mid);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
}

.spacer { flex: 1; }

.toggle {
  display: flex; align-items: center; gap: 7px;
  flex-shrink: 0;
  font-size: 12px; color: var(--text-mid);
}
.switch {
  width: 34px; height: 19px;
  padding: 2px;
  background: var(--border-2);
  border: none; border-radius: 999px;
  cursor: pointer;
  transition: background .2s;
}
.switch.on { background: var(--brand); }
.switch i {
  display: block; width: 15px; height: 15px;
  background: #fff; border-radius: 50%;
  box-shadow: var(--shadow-sm);
  transition: transform .2s;
}
.switch.on i { transform: translateX(15px); }

.status-pill {
  display: flex; align-items: center; gap: 6px;
  flex-shrink: 0;
  padding: 5px 11px;
  font-size: 12px; font-weight: 600;
  color: var(--green);
  background: var(--green-bg);
  border-radius: 999px;
}
.status-pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

.agent-chip {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
  padding-left: 14px;
  border-left: 1px solid var(--border);
}
.agent-avatar {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 700; color: #fff;
  background: var(--brand);
  border-radius: 8px;
}
.agent-info { line-height: 1.3; }
.agent-name { font-size: 12.5px; font-weight: 600; }
.agent-role { font-size: 11px; color: var(--text-soft); }

/* ============ 主区 ============ */
.main {
  height: calc(100% - var(--topbar-h));
  display: flex;
}

/* ---- 侧栏 ---- */
.nav {
  width: var(--nav-w); flex-shrink: 0;
  display: flex; flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--border);
}
.nav-label {
  padding: 14px 16px 7px;
  font-size: 11px; font-weight: 600;
  color: var(--text-soft);
  letter-spacing: .6px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px;
  margin: 1px 8px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--text-mid);
  border: none; background: none;
  font: inherit; text-align: left;
  width: calc(100% - 16px);
  transition: background .15s, color .15s;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--brand-light); color: var(--brand); font-weight: 600; }
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; }
.nav-item .num { margin-left: auto; font-size: 11px; color: var(--text-soft); font-variant-numeric: tabular-nums; }
.nav-item.active .num { color: var(--brand); }

.nav-foot { margin-top: auto; padding: 12px; border-top: 1px solid var(--border); }
.channels { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.channel {
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; color: var(--text-mid);
}
.channel i { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
.channel .cnt { margin-left: auto; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mode-tag {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 9px;
  font-size: 11.5px; font-weight: 600;
  color: var(--brand);
  background: var(--brand-light);
  border-radius: 7px;
}
.mode-tag svg { width: 13px; height: 13px; }

/* ---- 会话队列 ---- */
.queue {
  width: var(--queue-w); flex-shrink: 0;
  display: flex; flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--border);
}
.panel-head { padding: 13px 14px 0; flex-shrink: 0; }
.panel-title { display: flex; align-items: baseline; gap: 8px; }
.panel-title h2 { font-size: 14px; font-weight: 700; }
.panel-title span { font-size: 11.5px; color: var(--text-soft); }

.tabs {
  display: flex; gap: 2px;
  margin-top: 11px;
  border-bottom: 1px solid var(--border);
}
.tab {
  padding: 7px 9px;
  font: inherit; font-size: 12px;
  color: var(--text-mid);
  background: none; border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  transition: color .15s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--brand); font-weight: 600; border-bottom-color: var(--brand); }
.tab .cnt {
  margin-left: 4px;
  font-size: 11px; font-weight: 700;
  color: var(--text-soft);
  font-variant-numeric: tabular-nums;
}
.tab.active .cnt { color: var(--brand); }

.cards { flex: 1; overflow-y: auto; padding: 6px; }

.card {
  display: flex; gap: 9px;
  padding: 10px;
  margin-bottom: 5px;
  border-radius: 9px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background .14s, border-color .14s;
}
.card:hover { background: var(--surface-2); }
.card.active { background: var(--brand-light); border-color: var(--brand-mid); }
.card.removing { animation: fadeOut .28s forwards; }
@keyframes fadeOut { to { opacity: 0; transform: translateX(-14px); } }

.card-avatar {
  width: 32px; height: 32px; flex-shrink: 0;
  display: grid; place-items: center;
  font-size: 13px; font-weight: 700; color: #fff;
  background: var(--text-mid);
  border-radius: 8px;
}
.card-body { flex: 1; min-width: 0; }
.card-row { display: flex; align-items: baseline; gap: 6px; }
.card-name { font-size: 13px; font-weight: 600; }
.card-wait { margin-left: auto; font-size: 11px; color: var(--text-soft); font-variant-numeric: tabular-nums; }
.card-topic {
  font-size: 12px; color: var(--text-mid);
  margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }

.tag {
  padding: 1px 6px;
  font-size: 11px; font-weight: 600;
  color: var(--brand);
  background: var(--brand-light);
  border-radius: 4px;
  white-space: nowrap;
}
.tag.warn { color: var(--orange); background: var(--orange-bg); }
.tag.bad  { color: var(--red);    background: var(--red-bg); }

.sla { font-size: 11px; font-weight: 600; color: var(--text-soft); font-variant-numeric: tabular-nums; }
.sla.warn { color: var(--orange); }
.sla.bad  { color: var(--red); }

.tide { display: flex; align-items: center; gap: 4px; margin-left: auto; font-size: 11px; color: var(--text-soft); }
.tide-bar { width: 26px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.tide-bar i { display: block; height: 100%; border-radius: 2px; }
.tide-bar i.ok   { background: var(--green); }
.tide-bar i.warn { background: var(--orange); }
.tide-bar i.bad  { background: var(--red); }

/* ---- 聊天区 ---- */
.chat { flex: 1; min-width: 380px; display: flex; flex-direction: column; background: var(--surface-2); }

.chat-head {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.chat-head .who { line-height: 1.35; }
.chat-head .who b { font-size: 14px; }
.chat-head .who small { display: flex; gap: 7px; margin-top: 1px; font-size: 11.5px; color: var(--text-soft); }
.vip {
  padding: 1px 6px;
  font-size: 11px; font-weight: 700; color: #fff;
  background: var(--orange);
  border-radius: 4px;
}
.btn-ghost {
  padding: 6px 11px;
  font: inherit; font-size: 12px;
  color: var(--text-mid);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  cursor: pointer;
  transition: all .15s;
}
.btn-ghost:hover { color: var(--brand); border-color: var(--brand-mid); background: var(--brand-light); }

.thread { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 13px; }

.sep { display: flex; align-items: center; gap: 10px; margin: 3px 0; }
.sep::before, .sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.sep span { font-size: 11px; color: var(--text-soft); }

.sys-msg {
  align-self: center;
  max-width: 80%;
  padding: 5px 12px;
  font-size: 11.5px; color: var(--text-soft);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  text-align: center;
}

.msg { display: flex; gap: 8px; max-width: 76%; }
.msg.me { align-self: flex-end; flex-direction: row-reverse; }
.msg-avatar {
  width: 26px; height: 26px; flex-shrink: 0;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 700; color: #fff;
  background: var(--text-mid); border-radius: 7px;
}
.msg.me .msg-avatar { background: var(--brand); }
.msg-col { min-width: 0; }
.bubble {
  padding: 8px 12px;
  font-size: 13px; line-height: 1.55;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  border-top-left-radius: 3px;
  word-break: break-word; white-space: pre-wrap;
  box-shadow: var(--shadow-sm);
}
.msg.me .bubble {
  background: var(--brand-light);
  border-color: var(--brand-mid);
  border-top-left-radius: 12px;
  border-top-right-radius: 3px;
}
.bubble.draft {
  background: #FFF8E7;
  border-color: var(--orange-bd);
  border-top-left-radius: 12px;
}
.draft-label {
  display: flex; align-items: center; gap: 5px;
  margin-bottom: 4px;
  font-size: 11px; font-weight: 700; color: var(--orange);
}
.draft-label svg { width: 12px; height: 12px; }
.draft-actions { display: flex; gap: 6px; margin-top: 8px; }
.draft-actions button {
  padding: 4px 10px;
  font: inherit; font-size: 11.5px; font-weight: 600;
  border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border-2);
  background: var(--surface); color: var(--text-mid);
  transition: all .15s;
}
.draft-actions button.primary {
  background: var(--brand); border-color: var(--brand); color: #fff;
}
.draft-actions button.primary:hover { background: var(--brand-dark); }
.draft-actions button:hover:not(.primary) { border-color: var(--text-soft); }
.msg-meta { margin-top: 4px; font-size: 11px; color: var(--text-soft); }
.msg.me .msg-meta { text-align: right; }

/* 输入区 */
.composer { flex-shrink: 0; padding: 10px 16px 14px; background: var(--surface); border-top: 1px solid var(--border); }
.quick { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.quick button {
  padding: 4px 10px;
  font: inherit; font-size: 11.5px;
  color: var(--text-mid);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  cursor: pointer;
  transition: all .15s;
}
.quick button:hover { color: var(--brand); background: var(--brand-light); border-color: var(--brand-mid); }

.input-box {
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-2);
  transition: border-color .18s, box-shadow .18s;
}
.input-box:focus-within { border-color: var(--brand-mid); box-shadow: 0 0 0 3px rgba(27,117,120,.07); }
.input-tools {
  display: flex; align-items: center; gap: 2px;
  padding: 5px 8px;
  border-bottom: 1px solid var(--border);
}
.tool {
  flex-shrink: 0;          /* 被压缩会导致按钮文字竖排（实测踩过） */
  white-space: nowrap;
  padding: 4px 7px;
  display: flex; align-items: center; gap: 5px;
  font: inherit; font-size: 11.5px;
  color: var(--text-mid);
  background: none; border: none; border-radius: 6px;
  cursor: pointer;
  transition: background .14s, color .14s;
}
.tool:hover { background: var(--surface); color: var(--brand); }
.tool svg { width: 13px; height: 13px; }
.tool.ai-tool { color: var(--brand); font-weight: 600; }
.tool.ai-tool:disabled { opacity: .5; cursor: not-allowed; }

.input-row { display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px; }
#replyInput {
  flex: 1; min-width: 0; max-height: 96px;
  font: inherit; font-size: 13px; line-height: 1.55;
  color: var(--text);
  background: none; border: none; outline: none; resize: none;
}
#replyInput::placeholder { color: var(--text-soft); }
.btn-send {
  flex-shrink: 0;
  padding: 6px 15px;
  font: inherit; font-size: 12.5px; font-weight: 600;
  color: #fff; background: var(--brand);
  border: none; border-radius: 8px;
  cursor: pointer;
  transition: background .15s;
}
.btn-send:hover:not(:disabled) { background: var(--brand-dark); }
.btn-send:disabled { opacity: .45; cursor: not-allowed; }

/* ---- AI 面板 ---- */
.ai {
  width: var(--ai-w); flex-shrink: 0;
  display: flex; flex-direction: column;
  background: var(--surface);
  border-left: 1px solid var(--border);
  overflow-y: auto;
}
.ai-head {
  display: flex; align-items: center; gap: 8px;
  padding: 13px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.ai-head svg { width: 15px; height: 15px; color: var(--brand); }
.ai-head b { font-size: 13.5px; }
.ai-head .conf { margin-left: auto; font-size: 11px; color: var(--text-soft); font-variant-numeric: tabular-nums; }

.section { padding: 13px 14px; border-bottom: 1px solid var(--border); }
.section h3 {
  font-size: 11px; font-weight: 600;
  color: var(--text-soft);
  letter-spacing: .5px;
  margin-bottom: 10px;
}

.intent-row { margin-bottom: 9px; }
.intent-row .top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
.intent-row .top b { font-weight: 600; }
.intent-row .top span { color: var(--text-mid); font-variant-numeric: tabular-nums; }
.bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand-mid); border-radius: 3px; transition: width .3s; }
.intent-row.top1 .bar i { background: var(--brand); }

.kb-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 9px;
  margin-bottom: 6px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.kb-item .txt { flex: 1; min-width: 0; font-size: 12px; line-height: 1.4; }
.kb-item button {
  flex-shrink: 0;
  padding: 3px 9px;
  font: inherit; font-size: 11px; font-weight: 600;
  color: var(--brand);
  background: var(--surface);
  border: 1px solid var(--brand-mid);
  border-radius: 6px;
  cursor: pointer;
  transition: all .15s;
}
.kb-item button:hover { background: var(--brand); border-color: var(--brand); color: #fff; }

.profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pf {
  padding: 8px 9px;
  background: var(--surface-2);
  border-radius: 8px;
}
.pf .k { font-size: 11px; color: var(--text-soft); }
.pf .v { font-size: 13px; font-weight: 700; margin-top: 1px; font-variant-numeric: tabular-nums; }

.gauge { display: flex; align-items: center; gap: 10px; }
.gauge-num { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.gauge-num.ok { color: var(--green); }
.gauge-num.warn { color: var(--orange); }
.gauge-num.bad { color: var(--red); }
.gauge-bar { flex: 1; height: 7px; background: var(--border); border-radius: 4px; overflow: hidden; }
.gauge-bar i { display: block; height: 100%; border-radius: 4px; transition: width .3s; }
.gauge-txt { font-size: 11.5px; color: var(--text-mid); margin-top: 6px; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.actions button {
  padding: 7px;
  font: inherit; font-size: 12px; font-weight: 600;
  background: var(--surface);
  border: 1px solid var(--border-2);
  border-radius: 8px;
  cursor: pointer;
  color: var(--text-mid);
  transition: all .15s;
}
.actions button:hover { border-color: var(--brand-mid); background: var(--brand-light); color: var(--brand); }
.actions button.danger:hover { border-color: var(--red-bd); background: var(--red-bg); color: var(--red); }
.actions button.wide { grid-column: span 2; }

/* ---- Toast ---- */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(12px);
  padding: 9px 18px;
  font-size: 12.5px; font-weight: 600;
  color: #fff; background: var(--text);
  border-radius: 9px;
  box-shadow: var(--shadow-md);
  opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.empty-chat {
  flex: 1; display: grid; place-items: center;
  color: var(--text-soft);
}
.empty-chat .in { text-align: center; }
.empty-chat svg { width: 40px; height: 40px; margin: 0 auto 12px; color: var(--border-2); }
.empty-chat p { font-size: 13px; }
</style>
</head>
<body>

<!-- 顶栏 -->
<header class="topbar">
  <div class="brand">
    <div class="brand-mark" id="brandMark"></div>
    <div>
      <div class="brand-name">潮汐客服台</div>
      <div class="brand-sub">TIDE DESK</div>
    </div>
  </div>

  <div class="search">
    <span id="searchIcon"></span>
    <input id="globalSearch" placeholder="搜索客户、订单、会话…" autocomplete="off">
    <kbd>/</kbd>
  </div>

  <div class="spacer"></div>

  <div class="toggle">
    <span>AI 辅助</span>

        : String(CUSTOMERS.filter(function (c) { return c.flags[t.id]; }).length);
      b.appendChild(cnt);

      b.addEventListener('click', function () { tab = t.id; renderTabs(); renderCards(); });
      el.appendChild(b);
    });
  }

  function renderCards() {
    cardsEl.innerHTML = '';
    var list = visibleList();
    if (!list.length) {
      var empty = document.createElement('div');
      empty.style.cssText = 'padding:28px 14px;text-align:center;color:#8A9299;font-size:12px';
      empty.textContent = '该分组下暂无会话';
      cardsEl.appendChild(empty);
      return;
    }

    list.forEach(function (c) {
      var card = document.createElement('div');
      card.className = 'card' + (current && current.id === c.id ? ' active' : '');
      card.dataset.id = c.id;

      var av = document.createElement('div');
      av.className = 'card-avatar';
      av.textContent = c.name.charAt(0);
      card.appendChild(av);

      var body = document.createElement('div');
      body.className = 'card-body';

      var row = document.createElement('div');
      row.className = 'card-row';
      var nm = document.createElement('span');
      nm.className = 'card-name';
      nm.textContent = c.name;
      var wt = document.createElement('span');
      wt.className = 'card-wait';
      wt.textContent = '等待 ' + c.wait;
      row.appendChild(nm); row.appendChild(wt);
      body.appendChild(row);

      var tp = document.createElement('div');
      tp.className = 'card-topic';
      tp.textContent = c.topic;
      body.appendChild(tp);

      var meta = document.createElement('div');
      meta.className = 'card-meta';

      var tg = document.createElement('span');
      tg.className = 'tag' + (c.tagCls ? ' ' + c.tagCls : '');
      tg.textContent = c.tag;
      meta.appendChild(tg);

      var sla = document.createElement('span');
      sla.className = 'sla' + (c.slaCls ? ' ' + c.slaCls : '');
      sla.textContent = c.sla;
      meta.appendChild(sla);

      var td = document.createElement('div');
      td.className = 'tide';
      var tdl = document.createElement('span');
      tdl.textContent = '潮位 ' + c.tide + '%';
      var bar = document.createElement('div');
      bar.className = 'tide-bar';
      var fill = document.createElement('i');
      fill.className = tideLevel(c.tide);
      fill.style.width = c.tide + '%';
      bar.appendChild(fill);
      td.appendChild(tdl); td.appendChild(bar);
      meta.appendChild(td);

      body.appendChild(meta);
      card.appendChild(body);

      card.addEventListener('click', function () { select(c.id); });
      cardsEl.appendChild(card);
    });
  }

  /* ============ 渲染：聊天区 ============ */
  function renderHead() {
    chatHeadEl.innerHTML = '';
    if (!current) {
      chatHeadEl.innerHTML = '';
      return;
    }
    var av = document.createElement('div');
    av.className = 'card-avatar';
    av.textContent = current.name.charAt(0);
    chatHeadEl.appendChild(av);

    var who = document.createElement('div');
    who.className = 'who';
    var b = document.createElement('b');
    b.textContent = current.name;
    who.appendChild(b);
    if (current.vip) {
      var v = document.createElement('span');
      v.className = 'vip';
      v.textContent = current.vip;
      who.appendChild(v);
    }
    var sm = document.createElement('small');
    var ch = document.createElement('span');
    ch.textContent = '渠道 ' + current.ch;
    var od = document.createElement('span');
    od.textContent = '订单 ' + current.pf.orders + ' 笔';
    var wt = document.createElement('span');
    wt.textContent = '等待 ' + current.wait;
    sm.appendChild(ch); sm.appendChild(od); sm.appendChild(wt);
    who.appendChild(sm);
    chatHeadEl.appendChild(who);

    var spacer = document.createElement('div');
    spacer.className = 'spacer';
    chatHeadEl.appendChild(spacer);

    var btn = document.createElement('button');
    btn.className = 'btn-ghost';
    btn.type = 'button';
    btn.textContent = '历史订单';
    btn.addEventListener('click', function () {
      toast('历史订单面板在设计稿中未展开');
    });
    chatHeadEl.appendChild(btn);
  }

  function renderThread() {
    threadEl.innerHTML = '';
    if (!current) {
      threadEl.className = 'thread';
      var wrap = document.createElement('div');
      wrap.className = 'empty-chat';
      var inner = document.createElement('div');
      inner.className = 'in';
      var ic = document.createElement('div');
      setIcon(ic, 'chat');
      inner.appendChild(ic);
      var p = document.createElement('p');
      p.textContent = '从左侧队列选择一个会话开始接待';
      inner.appendChild(p);
      wrap.appendChild(inner);
      threadEl.appendChild(wrap);
      return;
    }

    var sep = document.createElement('div');
    sep.className = 'sep';
    var sp = document.createElement('span');
    sp.textContent = '今天';
    sep.appendChild(sp);
    threadEl.appendChild(sep);

    current.msgs.forEach(function (m) { threadEl.appendChild(buildMsg(m)); });
    if (draftMsg) threadEl.appendChild(buildDraft(draftMsg));
    threadEl.scrollTop = threadEl.scrollHeight;
  }

  function buildMsg(m) {
    if (m.r === 'sys') {
      var s = document.createElement('div');
      s.className = 'sys-msg';
      s.textContent = m.t;   // textContent：后端/用户输入一律纯文本
      return s;
    }
    var row = document.createElement('div');
    row.className = 'msg' + (m.r === 'me' ? ' me' : '');

    var av = document.createElement('div');
    av.className = 'msg-avatar';
    av.textContent = m.r === 'me' ? '周' : (current ? current.name.charAt(0) : '客');
    row.appendChild(av);

    var col = document.createElement('div');
    col.className = 'msg-col';

    var bub = document.createElement('div');
    bub.className = 'bubble';
    bub.textContent = m.t;
    col.appendChild(bub);

    var mt = document.createElement('div');
    mt.className = 'msg-meta';
    mt.textContent = m.time || nowTime();
    col.appendChild(mt);

    row.appendChild(col);
    return row;
  }

  function buildDraft(text) {
    var row = document.createElement('div');
    row.className = 'msg me';

    var av = document.createElement('div');
    av.className = 'msg-avatar';
    av.textContent = '周';
    row.appendChild(av);

    var col = document.createElement('div');
    col.className = 'msg-col';

    var bub = document.createElement('div');
    bub.className = 'bubble draft';

    var lab = document.createElement('div');
    lab.className = 'draft-label';
    var li = document.createElement('span');
    setIcon(li, 'spark');
    lab.appendChild(li);
    lab.appendChild(document.createTextNode('AI 草稿 · 待确认'));
    bub.appendChild(lab);

    var body = document.createElement('div');
    body.textContent = text;
    bub.appendChild(body);

    var acts = document.createElement('div');
    acts.className = 'draft-actions';

    var ok = document.createElement('button');
    ok.className = 'primary';
    ok.type = 'button';
    ok.textContent = '采用并发送';
    ok.addEventListener('click', function () { adoptDraft(text); });

    var redo = document.createElement('button');
    redo.type = 'button';
    redo.textContent = '重新生成';
    redo.addEventListener('click', function () { requestDraft(); });

    var no = document.createElement('button');
    no.type = 'button';
    no.textContent = '放弃';
    no.addEventListener('click', function () { draftMsg = null; renderThread(); });

    acts.appendChild(ok); acts.appendChild(redo); acts.appendChild(no);
    bub.appendChild(acts);
    col.appendChild(bub);
    row.appendChild(col);
    return row;
  }

  /* ============ 选中客户 ============ */
  function select(id) {
    var c = CUSTOMERS.filter(function (x) { return x.id === id; })[0];
    if (!c) return;
    current = c;
    draftMsg = null;
    renderCards();
    renderHead();
    renderThread();
    renderAI();
    $('replyInput').focus();
  }

  /* ============ AI 面板 ============ */
  function renderAI() {
    setIcon($('aiHeadIcon'), 'spark');
    setIcon($('tAi'), 'spark');
    setIcon($('tEmoji'), 'smile');
    setIcon($('tVar'), 'braces');
    setIcon($('tFile'), 'clip');
    setIcon($('tOrder'), 'cart');

    $('aiConf').textContent = current ? ('置信度 ' + current.conf) : '';

    var il = $('intentList');
    il.innerHTML = '';
    if (!current) {
      il.innerHTML = '<div style="font-size:12px;color:#8A9299">选择会话后显示意图分布</div>';
      $('kbList').innerHTML = '';
      $('profileGrid').innerHTML = '';
      $('tideNum').textContent = '—';
      $('tideBar').style.width = '0%';
      $('tideTxt').textContent = '';
      return;
    }

    current.intent.forEach(function (pair, i) {
      var row = document.createElement('div');
      row.className = 'intent-row' + (i === 0 ? ' top1' : '');
      var top = document.createElement('div');
      top.className = 'top';
      var b = document.createElement('b');
      b.textContent = pair[0];
      var s = document.createElement('span');
      s.textContent = pair[1] + '%';
      top.appendChild(b); top.appendChild(s);
      var bar = document.createElement('div');
      bar.className = 'bar';
      var fill = document.createElement('i');
      fill.style.width = pair[1] + '%';
      bar.appendChild(fill);
      row.appendChild(top); row.appendChild(bar);
      il.appendChild(row);
    });

    var kl = $('kbList');
    kl.innerHTML = '';
    current.kb.forEach(function (title) {
      var item = document.createElement('div');
      item.className = 'kb-item';
      var t = document.createElement('div');
      t.className = 'txt';
      t.textContent = title;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = '发送';
      btn.addEventListener('click', function () {
        var input = $('replyInput');
        input.value = input.value ? (input.value + '\n' + title) : title;
        input.focus();
        toast('已插入推荐话术');
      });
      item.appendChild(t); item.appendChild(btn);
      kl.appendChild(item);
    });

    var pg = $('profileGrid');
    pg.innerHTML = '';
    [['累计消费', current.pf.spend], ['订单数', current.pf.orders],
     ['满意度', current.pf.csat], ['等级', current.pf.vip]].forEach(function (kv) {
      var d = document.createElement('div');
      d.className = 'pf';
      var k = document.createElement('div');
      k.className = 'k';
      k.textContent = kv[0];
      var v = document.createElement('div');
      v.className = 'v';
      v.textContent = kv[1];
      d.appendChild(k); d.appendChild(v);
      pg.appendChild(d);
    });

    var lv = tideLevel(current.tide);
    var num = $('tideNum');
    num.textContent = current.tide + '%';
    num.className = 'gauge-num ' + lv;
    var bar = $('tideBar');
    bar.style.width = current.tide + '%';
    bar.style.background = lv === 'ok' ? '#0A6A46' : (lv === 'warn' ? '#D9830F' : '#AD2634');
    $('tideTxt').textContent = tideText(current.tide);
  }

  /* ============ 发送 ============ */
  function sendReply() {
    if (!current) { toast('请先选择一个会话'); return; }
    var input = $('replyInput');
    var text = input.value.trim();
    if (!text) return;

    current.msgs.push({ r: 'me', t: text, time: nowTime() });
    input.value = '';
    draftMsg = null;
    renderThread();
  }

  /* ============ AI 续写（真实调用后端） ============ */
  var busy = false, controller = null;

  function requestDraft() {
    if (!current) { toast('请先选择一个会话'); return; }
    if (busy) return;
    if (!aiOn) { toast('AI 辅助已关闭'); return; }

    // 取客户最后一条消息作为提问
    var last = null;
    for (var i = current.msgs.length - 1; i >= 0; i--) {
      if (current.msgs[i].r === 'cust') { last = current.msgs[i].t; break; }
    }
    if (!last) { toast('该会话暂无客户消息'); return; }

    busy = true;
    var btn = $('aiDraft');
    btn.disabled = true;
    var oldLabel = btn.lastChild.textContent;
    btn.lastChild.textContent = '生成中…';

    controller = new AbortController();
    var timer = setTimeout(function () { if (controller) controller.abort(); }, REQUEST_TIMEOUT);

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: last, session_id: current.id }),
      signal: controller.signal
    })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        draftMsg = data.reply || data.answer || '（后端未返回内容）';
        if (data.need_human) {
          toast('AI 建议转人工处理');
        }
        renderThread();
      })
      .catch(function (err) {
        var isAbort = err && (err.name === 'AbortError' || /abort/i.test(err.message || ''));
        toast(isAbort ? 'AI 生成超时，请重试'
                      : '无法连接后端（localhost:8000），请先启动服务');
      })
      .then(function () {
        clearTimeout(timer);
        controller = null;
        busy = false;
        btn.disabled = false;
        btn.lastChild.textContent = 'AI 续写';
      });
  }

  function adoptDraft(text) {
    if (!current) return;
    current.msgs.push({ r: 'me', t: text, time: nowTime() });
    draftMsg = null;
    renderThread();
    toast('已发送 AI 草稿');
  }

  /* ============ 快捷操作 ============ */
  document.querySelectorAll('.actions button').forEach(function (b) {
    b.addEventListener('click', function () {
      var act = b.dataset.act;
      if (!current) { toast('请先选择一个会话'); return; }
      if (act === 'human') {
        current.msgs.push({ r: 'sys', t: '已转接人工客服，等待专员接入' });
        renderThread();
        toast('已转接人工客服');
      } else if (act === 'ticket') {
        toast('工单已创建（Demo）');
      } else if (act === 'resolve') {
        var idx = CUSTOMERS.indexOf(current);
        if (idx >= 0) CUSTOMERS.splice(idx, 1);
        current = null;
        draftMsg = null;
        renderCards(); renderTabs(); renderHead(); renderThread(); renderAI();
        toast('会话已标记解决');
      }
    });
  });

  /* ============ 输入区事件 ============ */
  var input = $('replyInput');
  input.addEventListener('keydown', function (e) {
    // isComposing：中文输入法选词确认时按 Enter 会误发送
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendReply();
    }
  });
  $('btnSend').addEventListener('click', sendReply);
  $('aiDraft').addEventListener('click', requestDraft);

  // 工具条
  document.querySelectorAll('.tool[data-act]').forEach(function (b) {
    b.addEventListener('click', function () {
      var map = { emoji: '表情面板（Demo）', 'var': '变量插入（Demo）',
                  file: '附件上传（Demo）', order: '订单卡片（Demo）' };
      toast(map[b.dataset.act] || '功能演示');
    });
  });

  // 快捷话术
  var qEl = $('quick');
  QUICK.forEach(function (q) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = q;
    b.addEventListener('click', function () {
      input.value = input.value ? input.value + '\n' + q : q;
      input.focus();
    });
    qEl.appendChild(b);
  });

  // AI 开关
  $('aiToggle').addEventListener('click', function () {
    aiOn = !aiOn;
    this.classList.toggle('on', aiOn);
    toast(aiOn ? 'AI 辅助已开启' : 'AI 辅助已关闭');
  });

  // 搜索快捷键
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' &&
        document.activeElement.tagName !== 'TEXTAREA') {
      e.preventDefault();
      $('globalSearch').focus();
    }
  });

  /* ============ 初始化 ============ */
  renderNav();
  renderTabs();
  renderCards();
  renderHead();
  renderThread();
  renderAI();
  select('c1');   // 默认选中第一个会话，避免空屏
})();
</script>
</body>
</html>
